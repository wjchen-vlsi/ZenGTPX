# ZenGTPX Zen7 configuration
#
# Syntax:
#   key = value
#
# Lines beginning with # are comments.
# Inline comments are also allowed after values.

# ===========================================================================
# Native Zen engine
# ===========================================================================

# Path to Zen7 native DLL.
# Relative paths are resolved from the executable directory.
# Portable package default: place Zen.dll next to ZenGTPX.exe.
zenDll = Zen.dll

# GTP name reported by the `name` command.
# LizzieYzy Next uses KataGo-specific display paths for multi-candidate analysis.
# Keep this as KataGo for Lizzie compatibility; this does not mean ZenGTPX supports
# KataGo analysis JSON protocol.
gtpName = KataGo

# GTP trace file path.
# Empty disables tracing. Relative paths are resolved from the executable directory.
# Supported tokens: {timestamp}, {date}, {pid}.
# Development package default: keep GUI GTP traces without touching stdout.
tracePath = gtp_logs/zengtpx-trace-{timestamp}-{pid}.log

# Zen7 DLL trace file path.
# Empty disables tracing. Relative paths are resolved from the executable directory.
# Supported tokens: {timestamp}, {date}, {pid}.
# ZenGTPX will redirect standard output (stdout) from the Zen7 native DLL to the trace file.
zenTracePath = gtp_logs/zen7-native-trace-{timestamp}-{pid}.log

# ===========================================================================
# Strength mode
# ===========================================================================

# Strength mode.
# Allowed: rank, fixed-time, advanced.
#
# rank:
#   Default GUI-compatible mode. Uses the built-in Zen7 GUI rank table.
#   Configure rankPreset only; low-level strength values are derived.
#
# fixed-time:
#   GUI-compatible "specified thinking time" mode.
#   Uses full-strength settings:
#     maxSimulations = 1000000
#     pnLevel = 3
#     pnWeight = 1.0
#     vnMixRate = 0.75
#   Configure maxTimeSeconds to choose seconds per move.
#
# advanced:
#   Expert mode. Configure maxTimeSeconds, maxSimulations, pnLevel,
#   pnWeight, and vnMixRate directly.
mode = rank

# Rank preset used when mode = rank.
# Allowed: 6k, 5k, 4k, 3k, 2k, 1k, 1d, 2d, 3d, 4d, 5d, 6d, 7d, 8d, 9d.
# Default mirrors the common Zen7 GUI computer level selection.
rankPreset = 9d

# ===========================================================================
# Game setup
# ===========================================================================

# Board size.
# Allowed by wrapper: 1 to 25.
# Recommended: 19. Zen7 GUI-compatible play should use 19.
boardSize = 19

# Komi used for new games.
# Default: 0.5, matching Chinese-rule online games without extra GUI komi.
# Use 6.5 or 7.5 when your GUI/ruleset requires standard komi.
komi = 0.5

# Passive handicap game parameter.
# This does not place stones or change board state by itself.
# Actual handicap placement is controlled by GTP fixed_handicap/place_free_handicap.
# Allowed: 0 or greater.
handicap = 0

# Scoring rule used by GTP final_score.
# Allowed: japanese, territory, chinese, area.
#
# japanese / territory:
#   ZenGTP.py-compatible territory scoring:
#   territory + 2 * dead-opponent-stones + prisoners - komi.
#
# chinese / area:
#   ZenGTP.py-compatible area scoring:
#   alive stones + dead-opponent-stones + territory - komi.
#
# Both modes rely on Zen territory statistics for dead-stone classification.
# Chinese is the default for the packaged template because the primary GUI
# validation path uses Chinese-rule online games.
finalScoreRule = chinese

# ===========================================================================
# Common search settings
# ===========================================================================

# Zen native search threads.
# Allowed: positive integer.
# Recommended:
#   1-2  conservative GUI testing
#   4    close to old ZenGTP.py default
#   8    practical starting point on 8-core CPUs
# In mode = rank, native Zen7 GUI caps this path at 4 internally.
threads = 8

# Resign when Zen top move winrate is below this value.
# Allowed: 0.0 to 1.0.
# Recommended: 0.02 to 0.15.
# Use 0.03 or 0.05 if you want fewer early resignations.
resignThreshold = 0.1

# ===========================================================================
# Fixed-time / advanced settings
# ===========================================================================

# Per-move maximum thinking time in seconds.
# Used directly when mode = fixed-time or mode = advanced.
# In mode = rank, the Zen7 GUI rank table uses 60.0 seconds.
# GTP time_settings can override this for the current engine session.
# Allowed: 0 or greater.
# Recommended:
#   1.0-5.0   fast GUI play
#   30.0-60.0 stronger play
#   300.0+    long analysis
maxTimeSeconds = 60.0

# Maximum Zen simulations/playouts per move.
# Used directly only when mode = advanced.
# Allowed: positive integer.
# Useful reference values:
#   100       smoke test only
#   1000      low-rank practical test
#   2700      Zen7 GUI 5d rank preset
#   6000      Zen7 GUI 9d rank preset
#   1000000   fixed-time / long thinking mode
maxSimulations = 6000

# Zen policy level.
# Used directly only when mode = advanced.
# Allowed/recommended: 0 to 3.
pnLevel = 3

# Zen policy weight.
# Used directly only when mode = advanced.
# Observed Zen7 GUI rank range: 1.0 to 4.4.
# Fixed-time full-strength value: 1.0.
pnWeight = 1.0

# Zen value network mix rate.
# Used directly only when mode = advanced.
# Allowed: 0.0 to 1.0.
# Observed Zen7 GUI rank range: 0.30 to 0.75.
# Fixed-time full-strength value: 0.75.
vnMixRate = 0.75
