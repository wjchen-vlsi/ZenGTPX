# ZenGTPX Zen7 configuration
#
# Syntax:
#   key = value
#
# Lines beginning with # are comments.
# Inline comments are also allowed after values.

# ===========================================================================
# Native Zen engine
# ===========================================================================

# Path to Zen7 native DLL.
# Relative paths are resolved from the executable directory.
zenDll = Zen.dll

# ===========================================================================
# Game setup
# ===========================================================================

# Board size.
# Allowed by wrapper: 1 to 25.
# Recommended: 19. First version is primarily tested with 19.
boardSize = 19

# Komi used for new games.
# Recommended: 6.5 or 7.5, depending on the GUI/ruleset.
komi = 7.5

# Handicap is not supported in the first version.
# Allowed: 0 only.
handicap = 0

# ===========================================================================
# Search limits
# ===========================================================================

# Zen native search threads.
# Allowed: positive integer.
# Recommended: 1 to 4. Start with 1 or 2 for GUI testing.
threads = 1

# Per-move maximum thinking time in seconds.
# GTP time_settings can override this for the current engine session.
# Allowed: 0 or greater.
# Recommended: 0.5 to 60.0.
# Practical GUI range: 1.0 to 5.0.
maxTimeSeconds = 1.0

# Maximum Zen simulations/playouts per move.
# Allowed: positive integer.
# Recommended: 100 to 6000.
# 100 is fast and weak; 1000 is a practical smoke/match value;
# 2700 roughly matches the old ZenGTP.py 5d preset;
# 6000 roughly matches the old ZenGTP.py 9d preset.
maxSimulations = 100

# Resign when Zen top move winrate is below this value.
# Allowed: 0.0 to 1.0.
# Recommended: 0.02 to 0.15.
# Use 0.03 or 0.05 if you want fewer early resignations.
resignThreshold = 0.1

# ===========================================================================
# Zen7 policy/value parameters
# ===========================================================================

# Zen policy level.
# Recommended: 0 to 3.
# Old ZenGTP.py presets use 0 for low kyu and 3 for high dan.
pnLevel = 2

# Zen policy weight.
# Recommended: 1.0 to 4.4.
# Higher values appear in some old ZenGTP.py strength presets.
pnWeight = 1.0

# Zen value network mix rate.
# Recommended: 0.30 to 0.75.
# Old ZenGTP.py presets increase this for stronger dan settings.
vnMixRate = 0.55
