# ZenGTPX Zen7 繁體中文輔助設定檔
#
# 語法：
#   key = value
#
# 以 # 開頭的行是註解。
# 參數值後方也允許 inline comment。
#
# 此檔可直接作為 config 使用：
#   ZenGTPX.exe --config config\zen7_zh-TW.cfg
#
# 正式預設設定檔仍是 config\zen7.cfg；本檔用途是提供繁體中文說明。

# ===========================================================================
# Native Zen 引擎
# ===========================================================================

# Zen7 native DLL 路徑。
# 相對路徑會從 ZenGTPX.exe 所在目錄解析。
# 預設部署模型：Zen.dll 與 ZenGTPX.exe 放在同一層。
zenDll = Zen.dll

# GTP `name` 命令回報名稱。
# LizzieYzy Next 的多候選 analysis 顯示會走 KataGo-specific 分支。
# 為了 GUI 相容性建議保持 KataGo；這不代表 ZenGTPX 支援 KataGo analysis JSON protocol。
gtpName = KataGo

# GTP trace 檔案路徑。
# 留空會停用 trace。相對路徑會從 ZenGTPX.exe 所在目錄解析。
# 支援 token：{timestamp}、{date}、{pid}。
# 開發期預設開啟 GUI GTP trace，且不會污染 stdout。
tracePath = gtp_logs/zengtpx-trace-{timestamp}-{pid}.log

# ===========================================================================
# 棋力模式
# ===========================================================================

# 棋力模式。
# 允許值：rank、fixed-time、advanced。
#
# rank：
#   預設模式。比照 Zen7 GUI 的「指定等級」設定。
#   只需要設定 rankPreset；程式會套用內建 Zen7 GUI 棋力對照表。
#   此模式會固定使用 Zen7 GUI 等級表的 maxTimeSeconds = 60.0。
#
# fixed-time：
#   比照 Zen7 GUI 的「指定思考時間」設定。
#   會套用全力搜尋基準：
#     maxSimulations = 1000000
#     pnLevel = 3
#     pnWeight = 1.0
#     vnMixRate = 0.75
#   使用 maxTimeSeconds 決定每手思考秒數。
#
# advanced：
#   進階模式。不套用 GUI preset。
#   直接使用 maxTimeSeconds、maxSimulations、pnLevel、pnWeight、vnMixRate。
#   適合測試、對局實驗、長考或棋力調校。
mode = rank

# mode = rank 時使用的 Zen7 GUI 等級。
# 允許值：6k、5k、4k、3k、2k、1k、1d、2d、3d、4d、5d、6d、7d、8d、9d。
# 建議值：
#   5d：中高段位、搜尋量較小。
#   9d：Zen7 GUI 等級表最高段位。
rankPreset = 9d

# ===========================================================================
# 對局設定
# ===========================================================================

# 棋盤大小。
# wrapper 允許值：1 到 25。
# 建議值：19。Zen7 GUI 相容對局應使用 19。
boardSize = 19

# 新對局使用的貼目。
# 建議值：6.5 或 7.5，依 GUI / 規則設定而定。
komi = 7.5

# 被動的讓子數對局參數。
# 此設定本身不落子，也不改變棋盤狀態。
# 實際讓子放子仍由 GTP fixed_handicap / place_free_handicap 控制。
# 允許值：0 或更大。
handicap = 0

# GTP final_score 使用的點目規則。
# 允許值：japanese、territory、chinese、area。
#
# japanese / territory：
#   相容 ZenGTP.py 的日本規則計算：
#   空 + 2 * 對方死子 + 提子 - 貼目。
#
# chinese / area：
#   相容 ZenGTP.py 的中國規則 / 面積計算：
#   活子 + 對方死子 + 空 - 貼目。
#
# 兩種模式都依賴 Zen territory statistics 判斷死子。
# 預設使用 japanese，符合 Zen7 一般規則預期。
finalScoreRule = japanese

# ===========================================================================
# 通用搜尋設定
# ===========================================================================

# Zen native search threads。
# 允許值：正整數。
# 建議值：
#   1-2：保守穩定、低 CPU 佔用、GUI smoke test。
#   4：接近舊版 ZenGTP.py 預設值。
#   8：8 核心 CPU 上的實戰起點。
#   10-12：提高棋力但仍保留部分系統流暢度。
#   14+：長時間分析或短時間 benchmark。
# 注意：mode = rank 對應 Zen7 原生 GUI 等級路徑時，原生 GUI 會把此路徑限制在最多 4 threads。
threads = 4

# 當 Zen top move winrate 低於此值時投降。
# 允許值：0.0 到 1.0。
# 建議值：0.02 到 0.15。
#   0.00：幾乎不主動投降。
#   0.03 或 0.05：降低過早投降機率，適合測試。
#   0.10：保守預設值。
resignThreshold = 0.1

# ===========================================================================
# fixed-time / advanced 參數
# ===========================================================================

# 單手最大思考時間，單位為秒。
# mode = fixed-time 或 mode = advanced 時直接使用。
# mode = rank 時，Zen7 GUI 等級表固定使用 60.0 秒。
# GTP time_settings 可覆蓋目前 engine session 的此設定。
# 允許值：0 或更大。
# 建議值：
#   1.0-5.0：快速 GUI 對弈。
#   30.0-60.0：較強實戰。
#   300.0 以上：長考或分析用途。
maxTimeSeconds = 60.0

# 每手最大 Zen simulations / playouts。
# 只在 mode = advanced 時直接使用。
# 允許值：正整數。
# 參考值：
#   100：只適合啟動、GTP 協定與 smoke test。
#   1000：低級位實用測試值。
#   2700：Zen7 GUI 5d preset。
#   6000：Zen7 GUI 9d preset。
#   1000000：fixed-time / 長考模式。
maxSimulations = 6000

# Zen policy level。
# 只在 mode = advanced 時直接使用。
# 允許 / 建議值：0 到 3。
# Zen7 GUI 等級表中，低級位使用 0，高段位使用 3。
pnLevel = 3

# Zen policy weight。
# 只在 mode = advanced 時直接使用。
# Zen7 GUI 等級表觀測範圍：0.30 到 0.75。
# fixed-time 全力搜尋值：1.0。
pnWeight = 0.75

# Zen value network mix rate。
# 只在 mode = advanced 時直接使用。
# Zen7 GUI 等級表觀測範圍：1.0 到 4.4。
# fixed-time 全力搜尋值：0.75。
vnMixRate = 1.0
