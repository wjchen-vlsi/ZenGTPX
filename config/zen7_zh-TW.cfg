# ZenGTPX Zen7 繁體中文輔助設定檔
#
# 語法：
#   key = value
#
# 以 # 開頭的行是註解。
# 參數值後方也允許 inline comment。
#
# 此檔可直接作為 config 使用：
#   ZenGTPX.exe --config config\zen7_zh-TW.cfg
#
# 正式預設設定檔仍是 config\zen7.cfg；本檔用途是提供繁體中文說明。

# ===========================================================================
# Native Zen 引擎
# ===========================================================================

# Zen7 native DLL 路徑。
# 相對路徑會從 ZenGTPX.exe 所在目錄解析。
# 預設部署模型：Zen.dll 與 ZenGTPX.exe 放在同一層。
zenDll = Zen.dll

# ===========================================================================
# 對局設定
# ===========================================================================

# 棋盤大小。
# wrapper 允許值：1 到 25。
# 建議值：19。第一版主要以 19 路棋盤測試。
boardSize = 19

# 新對局使用的貼目。
# 建議值：6.5 或 7.5，依 GUI / 規則設定而定。
komi = 7.5

# 第一版不支援讓子。
# 允許值：僅 0。
handicap = 0

# ===========================================================================
# 搜尋限制
# ===========================================================================

# Zen native search threads。
# 允許值：正整數。
# 建議值：1 到 4。GUI 測試可先從 1 或 2 開始。
threads = 1

# 單手最大思考時間，單位為秒。
# GTP time_settings 可覆蓋目前 engine session 的此設定。
# 允許值：0 或更大。
# 建議值：0.5 到 60.0。
# GUI 實用範圍：1.0 到 5.0。
maxTimeSeconds = 1.0

# 每手最大 Zen simulations / playouts。
# 允許值：正整數。
# 建議值：100 到 6000。
# 100：快速但棋力弱。
# 1000：實用的 smoke / match 測試值。
# 2700：大致對應舊版 ZenGTP.py 5d preset。
# 6000：大致對應舊版 ZenGTP.py 9d preset。
maxSimulations = 100

# 當 Zen top move winrate 低於此值時投降。
# 允許值：0.0 到 1.0。
# 建議值：0.02 到 0.15。
# 若希望降低過早投降的機率，可使用 0.03 或 0.05。
resignThreshold = 0.1

# ===========================================================================
# Zen7 Policy/Value 參數
# ===========================================================================

# Zen policy level。
# 建議值：0 到 3。
# 舊版 ZenGTP.py presets 使用 0 表示低級位，3 表示高段位。
pnLevel = 2

# Zen policy weight。
# 建議值：1.0 到 4.4。
# 部分舊版 ZenGTP.py 棋力 presets 會使用較高值。
pnWeight = 1.0

# Zen value network mix rate。
# 建議值：0.30 到 0.75。
# 舊版 ZenGTP.py presets 會在較強段位設定中提高此值。
vnMixRate = 0.55
